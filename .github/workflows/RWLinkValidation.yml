name: Link Validation

on:
    workflow_call:
  
jobs:
    LinkValidator:

        name: Validate Links
        runs-on: ubuntu-22.04
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Run linkspector
              uses: umbrelladocs/action-linkspector@v1
              with:
                fail_level: any
                filter_mode: nofilter
                config_file: ./.linkspector.yml
